{% extends "base.html" %}
{% set active = 'gyms' %}
{% block content %}
<h2>Gyms</h2>
<form method="GET" class="card filters">
    <input name="q" placeholder="Search by name" value="{{ q }}">
    <button class="btn" type="submit">Search</button>
</form>
<table>
    <tr><th>Photo</th><th>Name</th><th>Location</th><th>Ring Size</th></tr>
    {% for g in gyms %}
    <tr>
        <td><img class="gym-photo" src="{{ g['photo'] or 'https://placehold.co/120x88?text=%20' }}" alt=""></td>
        <td>{{ g['name'] }}</td>
        <td>{{ g['location'] }}</td>
        <td>{{ g['ring_size'] or '—' }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No gyms registered yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
