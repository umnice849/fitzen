<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FITZEN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing">

<div class="landing-wrap">
    <h1 class="landing-brand">FITZEN</h1>
    <p class="landing-sub">Find your next fight.</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
        {% endif %}
    {% endwith %}

    <div class="role-grid">
        <a class="role-tile" href="{{ url_for('choose_role', role='fighter') }}">
            <svg class="role-icon" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M22 14c0-2 1.5-3.5 3.5-3.5S29 12 29 14v6M35 14c0-2 1.5-3.5 3.5-3.5S42 12 42 14v6"
                      fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="14" y="20" width="16" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
                <rect x="34" y="20" width="16" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M14 30h16M34 30h16" stroke="currentColor" stroke-width="2.5"/>
                <rect x="17" y="40" width="10" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <rect x="37" y="40" width="10" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
            </svg>
            <span class="role-label">Fighter</span>
            <span class="role-hint">Create a profile and find opponents</span>
        </a>

        <a class="role-tile" href="{{ url_for('choose_role', role='viewer') }}">
            <svg class="role-icon" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="22" r="10" fill="currentColor"/>
                <path d="M14 50c0-10 8-16 18-16s18 6 18 16z" fill="currentColor"/>
            </svg>
            <span class="role-label">Viewer</span>
            <span class="role-hint">Browse fights — no account needed</span>
        </a>

        <a class="role-tile" href="{{ url_for('choose_role', role='gym') }}">
            <svg class="role-icon" viewBox="0 0 64 64" aria-hidden="true">
                <path d="M10 44V24l22-10 22 10v20" fill="none" stroke="currentColor" stroke-width="3"
                      stroke-linejoin="round"/>
                <path d="M10 44h44M10 30h44M10 37h44" stroke="currentColor" stroke-width="2"/>
                <path d="M12 24v22M52 24v22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="role-label">Gym</span>
            <span class="role-hint">Manage fighters and approve fights</span>
        </a>
    </div>
</div>

</body>
</html>
