{% extends "base.html" %}
{% block content %}
<h2>Fighter Registration</h2>
<div class="card">
<form method="POST">
    <div class="field"><label>Username</label><input name="username" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <div class="field"><label>Full Name</label><input name="name" required></div>
    <div class="field"><label>Age</label><input type="number" name="age" min="16" required>
        <small>Must be 16 or older to register.</small></div>
    <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" name="weight" required></div>
    <div class="field"><label>Height (cm)</label><input type="number" step="0.1" name="height"></div>
    <div class="field">
        <label>Weight Class</label>
        <select name="weight_class" required>
            {% for wc in weight_classes %}<option value="{{ wc }}">{{ wc }}</option>{% endfor %}
        </select>
    </div>
    <div class="field"><label>Skill Level (1-10)</label><input type="number" name="skill_level" min="1" max="10" required></div>
    <div class="field">
        <label>Gym (optional)</label>
        <select name="gym_id">
            <option value="">-- none --</option>
            {% for g in gyms %}<option value="{{ g['id'] }}">{{ g['name'] }}</option>{% endfor %}
        </select>
    </div>
    <div class="field"><label>Photo URL (optional)</label><input name="photo"></div>
    <div class="field"><label>Contact Info</label><input name="contact" required></div>
    <button class="btn" type="submit">Create Account</button>
</form>
</div>
{% endblock %}
